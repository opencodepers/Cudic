<!DOCTYPE html><html lang="en"><head><script>try{if(localStorage.getItem('glox_theme')!=='light')document.documentElement.dataset.theme='dark';}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cudic — Server</title>
  <meta name="description" content="A Cudic server space: channels, live chat, and the people in them.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/cudic_sfsvg.svg">
  <link rel="stylesheet" href="/sidebar.css?v=25">
  <style>
    body { display: flex; overflow: hidden; height: 100%; }
    .server-layout {
      flex: 1; width: 0; display: flex; overflow: hidden; min-width: 0;
      background: var(--panel); position: relative;
    }
    .server-main {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
      min-width: 0; min-height: 0;
    }

    /* ── Channel sidebar (Discord-style, inside the capsule) ── */
    .server-sidebar {
      width: 280px; background: var(--panel); border-right: 1px solid var(--line);
      display: none; flex-direction: column; flex-shrink: 0; overflow: hidden;
      position: absolute; left: 0; top: 0; bottom: 0; z-index: 20;
    }
    .server-sidebar.open { display: flex; }
    @media (min-width: 900px) { .server-sidebar { display: flex; position: static; } }
    .srv-head {
      padding: 14px 16px; border-bottom: 1px solid var(--line); flex-shrink: 0;
      display: flex; align-items: center; gap: 10px; overflow: hidden;
    }
    .srv-icon {
      width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0; overflow: hidden;
      background: var(--signal-tint); color: var(--signal);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-head); font-weight: 700; font-size: 0.9rem;
    }
    .srv-icon img { width: 100%; height: 100%; object-fit: cover; }
    .srv-name {
      font-family: var(--font-head); font-weight: 600; font-size: 0.95rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .srv-meta { font-size: 0.7rem; color: var(--text-tertiary); margin-top: 2px; }
    .back-row {
      padding: 10px 14px 4px; flex-shrink: 0;
    }
    .back-row a {
      font-size: 0.78rem; color: var(--text-secondary); text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .back-row a:hover { color: var(--signal); }
    .chan-label {
      font-size: var(--text-xs); font-weight: 600; color: var(--text-tertiary);
      padding: 14px 16px 6px; text-transform: uppercase; letter-spacing: 0.06em; flex-shrink: 0;
    }
    .chan-list { flex: 1; overflow-y: auto; padding: 0 8px 10px; }
    .chan-row {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 7px 10px; border: none; border-radius: var(--radius-sm);
      background: none; cursor: pointer; text-align: left; font-family: inherit;
      font-size: 0.875rem; color: var(--text-secondary);
    }
    .chan-row:hover { background: var(--panel-raised); color: var(--text-primary); }
    .chan-row.active { background: var(--signal-tint); color: var(--text-primary); font-weight: 500; }
    .chan-hash {
      font-family: var(--font-head); font-weight: 600; color: var(--text-tertiary);
      width: 18px; text-align: center; flex-shrink: 0;
    }
    .chan-row.active .chan-hash { color: var(--signal); }
    .chan-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chan-lock { font-size: 0.65rem; color: var(--text-tertiary); flex-shrink: 0; }
    .sidebar-foot {
      padding: 10px 14px; border-top: 1px solid var(--line); flex-shrink: 0;
      font-size: 0.75rem;
    }
    .sidebar-foot a { color: var(--text-secondary); text-decoration: none; }
    .sidebar-foot a:hover { color: var(--signal); }

    /* ── Message pane: same recipe as /chat ────────────────── */
    .topbar {
      padding: 14px 20px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-head); font-weight: 600; font-size: 1rem;
      background: var(--panel); flex-shrink: 0; min-width: 0;
    }
    .topbar .mobile-menu { display: inline-flex; }
    @media (min-width: 900px) { .topbar .mobile-menu { display: none; } }
    .topbar .mobile-menu button {
      width: 32px; height: 32px; border-radius: var(--radius-sm);
      border: 1px solid var(--line); background: transparent;
      color: var(--text-secondary); cursor: pointer; font-size: 1rem; line-height: 1;
    }
    .topbar .topic {
      font-family: var(--font-body); font-weight: 400; font-size: 0.8rem;
      color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; flex: 1; min-width: 0;
    }
    .topbar .online { font-family: var(--font-body); font-weight: 400; font-size: 0.75rem; color: var(--text-tertiary); flex-shrink: 0; }
    .topbar .online .dot { color: var(--success); }
    .messages { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .msg {
      display: flex; gap: 10px; margin-bottom: 14px; font-size: 0.9375rem; line-height: 1.6;
      color: var(--text-primary); font-weight: 400; letter-spacing: 0.01em;
      font-family: var(--font-body);
    }
    .msg-ava {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      background: var(--signal-tint); color: var(--signal);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-head); font-weight: 600; font-size: 0.75rem;
      overflow: hidden; margin-top: 2px;
    }
    .msg-ava img { width: 100%; height: 100%; object-fit: cover; }
    .msg-main { flex: 1; min-width: 0; }
    .msg-text { overflow-wrap: break-word; white-space: pre-wrap; word-break: break-word; }
    .msg.mine { justify-content: flex-end; }
    .msg.mine .msg-ava { display: none; }
    .msg.mine .msg-main { display: flex; flex-direction: column; align-items: flex-end; }
    .msg.mine .author { display: none; }
    .msg.mine .msg-text { background: var(--signal-tint); border-radius: 12px 4px 12px 12px; padding: 8px 12px; max-width: 75%; }
    .msg .author { font-weight: 600; margin-right: 8px; color: var(--signal); font-family: var(--font-head); }
    .msg .time { color: var(--text-tertiary); font-size: 0.75rem; margin-left: 8px; font-weight: 400; }
    .msg.pending { opacity: 0.6; }
    .msg-text code { font-family: var(--font-mono); background: var(--bg); padding: 1px 4px; border-radius: 3px; font-size: .9em; }
    .msg-text b, .msg-text strong { font-weight: 600; }
    .msg-text i, .msg-text em { font-style: italic; }
    .msg-text a { color: var(--blue); text-decoration: underline; }
    .msg-text mark { background: var(--lime); color: #0d0e10; padding: 0 2px; border-radius: 2px; }
    .msg-actions { display: flex; gap: 2px; margin-top: 4px; flex-wrap: wrap; align-items: center; min-height: 6px; }
    .msg-react {
      background: none; border: 1px solid transparent; padding: 1px 6px; font-size: 0.78rem;
      font-family: inherit; cursor: pointer; border-radius: 999px; color: var(--text-tertiary);
    }
    .msg-react:hover { border-color: var(--line); color: var(--text-primary); }
    .msg-react.on { border-color: var(--signal); color: var(--signal); background: var(--signal-tint); }
    .react-picker { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; display: flex; gap: 2px; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
    .react-picker button { background: none; border: 0; font-size: 1rem; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
    .react-picker button:hover { background: var(--bg); }
    #pinnedShelf { padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-shrink: 0; max-height: 130px; overflow-y: auto; }
    #pinnedShelf .ps-head { font-size: 0.72rem; font-weight: 700; color: var(--text-tertiary); font-family: var(--font-head); margin-bottom: 4px; }
    #pinnedShelf .ps-row { font-size: 0.8rem; color: var(--text-secondary); padding: 4px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
    #pinnedShelf .ps-row b { color: var(--text-primary); }
    .msg.pinned .msg-text { outline: 1px solid var(--signal); border-radius: 6px; }
    #slowNote { font-size: 0.74rem; color: var(--text-tertiary); padding: 0 18px 4px; flex-shrink: 0; }
    .system { color: var(--text-secondary); font-size: 0.8125rem; text-align: center; margin: 8px 0; font-style: italic; }
    .system.join { color: var(--success); }
    .typing-indicator { padding: 4px 20px; color: var(--text-tertiary); font-size: 0.8rem; font-style: italic; }
    .chat-input-area {
      display: flex; gap: 10px; padding: 10px 16px;
      border-top: 1px solid var(--line); background: var(--panel);
    }
    .chat-input-area input {
      flex: 1; background: var(--panel-raised); border: 1px solid var(--line);
      border-radius: var(--radius-sm); padding: 9px 12px; color: var(--text-primary);
      font-size: 0.875rem; font-family: inherit; outline: none; transition: border-color 0.15s;
    }
    .chat-input-area input::placeholder { color: var(--text-tertiary); }
    .chat-input-area input:focus { outline: 2px solid var(--signal); outline-offset: 1px; }
    .btn-send {
      background: var(--signal); color: var(--on-signal, #fff); border: none;
      border-radius: var(--radius-sm); padding: 10px 18px; font-size: 0.875rem;
      font-weight: 600; cursor: pointer; font-family: var(--font-head); transition: background 0.15s;
    }
    .btn-send:hover { background: var(--signal-hover); }
    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-secondary); gap: 10px; padding: 30px; text-align: center;
    }
    .rules-overlay {
      position: fixed; inset: 0; z-index: 9000; background: rgba(0, 0, 0, 0.6);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .rules-card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: 24px; width: 400px; max-width: 90vw;
      max-height: 80vh; overflow-y: auto;
    }
    .rules-card h2 { font-family: var(--font-head); font-weight: 600; margin: 0 0 12px; font-size: 1.1rem; }
    .rules-card p { font-size: 0.85rem; line-height: 1.7; white-space: pre-wrap; margin: 0 0 16px; }
    .rules-actions { display: flex; gap: 8px; justify-content: flex-end; }
  </style>

<body data-page="servers">
  <div class="server-layout page-panel">
    <aside class="server-sidebar open" id="serverSidebar">
      <div class="srv-head">
        <div class="srv-icon" id="srvIcon">?</div>
        <div style="min-width:0">
          <div class="srv-name" id="srvName">Loading…</div>
          <div class="srv-meta" id="srvMeta"></div>
        </div>
      </div>
      <div class="back-row"><a href="/servers">← All servers</a></div>
      <div class="chan-label">Channels</div>
      <div class="chan-list" id="chanList">
        <div class="chan-row" aria-hidden="true"><span class="sk" style="height:12px;width:60%;border-radius:4px;display:block"></span></div>
        <div class="chan-row" aria-hidden="true"><span class="sk" style="height:12px;width:45%;border-radius:4px;display:block"></span></div>
        <div class="chan-row" aria-hidden="true"><span class="sk" style="height:12px;width:55%;border-radius:4px;display:block"></span></div>
      </div>
      <div class="sidebar-foot"><a href="/chat">Your DMs &amp; rooms →</a></div>
    </aside>
    <main class="server-main" id="serverMain">
      <div class="topbar" id="topbar" hidden>
        <span class="mobile-menu"><button id="menuBtn" aria-label="Toggle channels">☰</button></span>
        <span id="chanTitle"></span>
        <span class="topic" id="chanTopic"></span>
        <span class="online" id="onlineCount"></span>
      </div>
      <div id="emptyState" style="flex:1;display:flex;align-items:center;justify-content:center;min-height:0">
        <div class="empty-state">
          <h2 style="font-family:var(--font-head);font-size:1.1rem;color:var(--text-primary)">Loading server…</h2>
          <p id="emptyText" style="font-size:0.85rem">Stand by — fetching channels.</p>
          <a href="/servers" style="font-size:0.85rem;color:var(--signal)">Browse servers →</a>
        </div>
      </div>
      <div id="pinnedShelf" hidden></div>
      <div id="messages" class="messages" hidden></div>
      <div id="typingIndicator" class="typing-indicator" style="display:none"></div>
      <p id="slowNote" style="display:none"></p>
      <form id="chatForm" class="chat-input-area" hidden>
        <input type="text" id="msgInput" placeholder="Message #channel" aria-label="Type a message" maxlength="2000" autocomplete="off" disabled>
        <button type="submit" class="btn-send">Send</button>
      </form>
      <div id="rulesOverlay" hidden>
        <div class="rules-card">
          <h2>Server rules</h2>
          <p id="rulesText"></p>
          <div class="rules-actions">
            <button class="btn-send" style="background:var(--panel-raised);color:var(--text-primary);border:1px solid var(--line)" id="rulesLater">Later</button>
            <button class="btn-send" id="rulesAccept">I agree — continue</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/config.js"></script>
  <script src="/auth.js"></script>
  <script src="/sidebar.js?v=25"></script>
  <script>
(function () {
  // ── Server space: channels on the left, one live room at a time ──
  // Lean on purpose: this page is the Discord-style server shell (route
  // /server/<id>); the full chat page keeps DMs, reporting, and the mod panel.
  var $ = function (id) { return document.getElementById(id); };
  var apiHost = (typeof WS_URL !== 'undefined' && WS_URL) ? WS_URL.replace(/^wss?:\/\//, 'https://') : '';
  var TOKEN = null, ME = null, MYNAME = 'You', MYAVA = null;
  var srv = null, chans = [], current = null, myRole = null;
  var ws = null, wsReady = false, pendingJoin = null, reconnectTries = 0;
  var mEl = $('messages'), myReacts = {};
  var pathId = (/^\/server\/([A-Za-z0-9-]{6,50})$/.exec(location.pathname) || [])[1];
  var SID = pathId || new URLSearchParams(location.search).get('id');

  function esc(s) {
    s = s == null ? '' : String(s);
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function nameColor(name) {
    name = String(name || '?'); var hash = 0;
    for (var i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return 'hsl(' + (Math.abs(hash) % 360) + ', 70%, 65%)';
  }
  function fmtTime(iso) { try { return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  var EMOJI_MAP = {
    ':smile:':'😀',':grin:':'😁',':laugh:':'😂',':wink:':'😉',':heart:':'❤️',
    ':thumbsup:':'👍',':thumbsdown:':'👎',':fire:':'🔥',':star:':'⭐',':rocket:':'🚀',
    ':check:':'✅',':cross:':'❌',':party:':'🎉',':eyes:':'👀',':wave:':'👋',
    ':clap:':'👏',':think:':'🤔',':cool:':'😎',':cry:':'😢',':angry:':'😡',
    ':ok:':'👌',':100:':'💯',':sparkles:':'✨',':zap:':'⚡',':sun:':'☀️',
    ':moon:':'🌙',':cloud:':'☁️',':rain:':'🌧️',':snow:':'❄️',':music:':'🎵'
  };
  function inlineFmt(s) {
    s = s.replace(/:[a-z0-9_+-]+:/gi, function (m) { return EMOJI_MAP[m.toLowerCase()] || m; });
    s = esc(s);
    s = s.replace(/==([^=\n]+)==/g, '<mark>$1</mark>');
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s;
  }
  function renderMsgText(raw) {
    var lines = String(raw || '').split('\n'), out = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i], t = line.trim();
      if (t === '') { out.push('<br>'); continue; }
      if (/^#{1,3}\s+/.test(t)) { out.push('<div style="font-weight:600;margin:4px 0 2px;font-family:var(--font-head)">' + inlineFmt(t.replace(/^#+\s*/, '')) + '</div>'); continue; }
      if (/^>\s?/.test(t)) { out.push('<blockquote style="margin:4px 0;padding:4px 10px;border-left:3px solid var(--line);color:var(--text-secondary);font-style:italic">' + inlineFmt(t.replace(/^>\s?/, '')) + '</blockquote>'); continue; }
      out.push('<div style="margin:0 0 4px">' + inlineFmt(line) + '</div>');
    }
    return out.join('');
  }

  function setStatus(title, text) {
    $('emptyState').style.display = 'flex';
    mEl.hidden = true; $('topbar').hidden = true; $('chatForm').hidden = true;
    $('emptyState').firstElementChild.firstElementChild.textContent = title;
    $('emptyText').textContent = text;
  }

  function authHeaders(extra) {
    return Object.assign({ 'Authorization': 'Bearer ' + TOKEN }, extra || {});
  }

  async function boot() {
    SID = pathId || new URLSearchParams(location.search).get('id');
    if (!SID) { location.replace('/servers'); return; }
    try { TOKEN = (typeof getAuthToken === 'function') ? await getAuthToken() : null; } catch (e) { TOKEN = null; }
    if (!TOKEN) { location.href = '/login'; return; }
    try {
      var s = await fetch(apiHost + '/api/session', { headers: authHeaders() }).then(r => r.json());
      ME = s && s.user && s.user.id;
      if (!ME) { location.href = '/login'; return; }
    } catch (e) { location.href = '/login'; return; }
    // Own name/avatar for optimistic rendering.
    try {
      var p = await fetch(apiHost + '/api/profile', { headers: authHeaders() }).then(r => r.json());
      if (p && p.profile) { MYNAME = p.profile.display_name || MYNAME; MYAVA = p.profile.avatar_url || null; }
    } catch (e) {}
    connectWs();
    loadServer();
  }

  async function loadServer() {
    try {
      var d = await fetch(apiHost + '/api/servers', { headers: authHeaders() }).then(r => r.json());
      srv = (d.servers || []).find(x => x.id === SID);
      if (!srv) { setStatus('Server not found', 'It may be private — join it from the server browse page first.'); return; }
      $('srvIcon').innerHTML = srv.icon_url ? '<img src="' + esc(srv.icon_url) + '" alt="">' : esc(srv.name.substring(0, 1).toUpperCase());
      $('srvName').textContent = srv.name;
      $('srvMeta').textContent = (srv.member_count || 0) + ' member' + ((srv.member_count || 0) === 1 ? '' : 's');
    } catch (e) { setStatus('Could not load server', 'Check your connection, then try again.'); return; }
    try {
      var cd = await fetch(apiHost + '/api/servers/' + SID + '/channels', { headers: authHeaders() }).then(r => r.json());
      chans = cd.channels || [];
    } catch (e) { chans = []; }
    if (!chans.length) { setStatus('No channels yet', 'This server has no channels you can see.'); return; }
    var slug = new URLSearchParams(location.search).get('c');
    var target = slug ? chans.find(c => c.slug === slug) : null;
    renderChans(target || chans[0]);
    openChannel(target || chans[0]);
  }

  function renderChans(active) {
    var html = '';
    chans.forEach(function (c) {
      html += '<button class="chan-row' + (current && c.id === current.id ? ' active' : '') + '" data-cid="' + esc(c.id) + '">'
        + '<span class="chan-hash">#</span><span class="chan-name">' + esc(c.display) + '</span>'
        + (c.is_private ? '<span class="chan-lock" title="Private channel">🔒</span>' : '') + '</button>';
    });
    $('chanList').innerHTML = html;
    [].forEach.call($('chanList').querySelectorAll('.chan-row'), function (el) {
      el.onclick = function () {
        var c = chans.find(x => x.id === el.getAttribute('data-cid'));
        if (c) { openChannel(c); $('serverSidebar').classList.remove('open'); }
      };
    });
    void active;
  }

  async function openChannel(ch) {
    current = ch;
    renderChans(ch);
    mEl.hidden = false; mEl.innerHTML = '';
    $('topbar').hidden = false; $('chatForm').hidden = false;
    $('emptyState').style.display = 'none';
    $('chanTitle').textContent = '# ' + ch.display;
    $('chanTopic').textContent = ch.topic || '';
    var note = $('slowNote');
    if (ch.slow_seconds > 0) { note.style.display = 'block'; note.textContent = 'Slow mode on — one message every ' + ch.slow_seconds + 's.'; }
    else { note.style.display = 'none'; note.textContent = ''; }
    $('pinnedShelf').hidden = true; $('pinnedShelf').innerHTML = '';
    myReacts = {};
    $('onlineCount').textContent = '';
    addSys('Joining # ' + ch.display + '…');
    sendJoin(ch.name);
    try {
      var d = await fetch(apiHost + '/api/messages?lobby=' + encodeURIComponent(ch.name), { headers: authHeaders() }).then(r => r.json());
      if (current !== ch) return;
      mEl.innerHTML = '';
      var ms = d.messages || [];
      if (ms.length) ms.forEach(m => addMsg(m.display_name, m.text, m.created_at, m.users && m.users.avatar_url, m.user_id, m.id));
      else addSys('No messages yet — say hello.');
      loadPinned();
    } catch (e) { addSys('Could not load history.'); }
  }

  function loadPinned() {
    fetch(apiHost + '/api/messages?lobby=' + encodeURIComponent(current.name) + '&pinned=1', { headers: authHeaders() })
      .then(r => r.json())
      .then(function (d) { if (current) renderPinned(d.messages || []); })
      .catch(function () {});
  }
  function renderPinned(rows) {
    var shelf = $('pinnedShelf');
    if (!rows.length) { shelf.hidden = true; shelf.innerHTML = ''; return; }
    var html = '<div class="ps-head">📌 Pinned</div>';
    rows.forEach(function (m) {
      html += '<div class="ps-row" data-mid="' + esc(m.id) + '"><b>' + esc(m.display_name || '?') + '</b> '
        + esc(String(m.text || '').replace(/\s+/g, ' ').substring(0, 120)) + '</div>';
    });
    shelf.innerHTML = html; shelf.hidden = false;
    [].forEach.call(shelf.querySelectorAll('.ps-row'), function (el) {
      el.onclick = function () {
        var div = mEl.querySelector('.msg[data-mid="' + el.getAttribute('data-mid') + '"]');
        if (div) div.scrollIntoView({ block: 'center' });
      };
    });
  }

  function addMsg(author, text, iso, avatar, userId, mid) {
    var mine = ME && userId === ME;
    var div = document.createElement('div');
    div.className = 'msg' + (mine ? ' mine' : '');
    if (mid && /^[0-9a-f-]{36}$/i.test(mid)) div.dataset.mid = mid;
    var av = avatar ? '<img src="' + esc(avatar) + '" alt="">' : esc(String(author || '?').substring(0, 1).toUpperCase());
    div.innerHTML = '<div class="msg-ava">' + av + '</div>'
      + '<div class="msg-main"><span class="author" style="color:' + nameColor(author) + '">' + esc(author) + '</span>'
      + '<span class="time">' + fmtTime(iso) + '</span>'
      + '<div class="msg-text">' + renderMsgText(text) + '</div>'
      + '<div class="msg-actions"></div></div>';
    mEl.appendChild(div);
    if (mid) armActions(div, mid, userId);
    mEl.scrollTop = mEl.scrollHeight;
  }
  function addSys(text) {
    var div = document.createElement('div');
    div.className = 'system'; div.textContent = text;
    mEl.appendChild(div); mEl.scrollTop = mEl.scrollHeight;
  }

  // Reactions + pin: mirrors /chat — server enforces who may pin/act.
  var QUICK_REACTIONS = ['👍', '❤️', '😂', '🎉', '🔥', '👀', '✨', '👎'];
  function armActions(div, mid, uid) {
    if (typeof mid !== 'string' || !/^[0-9a-f-]{36}$/i.test(mid)) return;
    var row = div.querySelector('.msg-actions');
    if (!row || row.querySelector('.msg-react')) return;
    var react = document.createElement('button');
    react.type = 'button'; react.className = 'msg-react'; react.textContent = '＋';
    react.title = 'Add reaction'; react.dataset.mid = mid;
    row.appendChild(react);
    if (myRole === 'owner' || myRole === 'mod') {
      addPin(div, mid);
    } else if (uid && ME && uid === ME) {
      addPin(div, mid);   // authors may pin their own messages
    }
  }
  function addPin(div, mid) {
    var row = div.querySelector('.msg-actions');
    if (!row || row.querySelector('.msg-pin')) return;
    var pin = document.createElement('button');
    pin.type = 'button'; pin.className = 'msg-react msg-pin';
    pin.textContent = div.classList.contains('pinned') ? 'Unpin' : 'Pin';
    pin.dataset.mid = mid; pin.title = 'Pin or unpin this message';
    row.appendChild(pin);
  }
  function paintReactions(mid, counts) {
    if (!mid || !/^[0-9a-f-]{36}$/i.test(mid)) return;
    var div = mEl.querySelector('.msg[data-mid="' + mid + '"]');
    if (!div) return;
    var row = div.querySelector('.msg-actions');
    if (!row) return;
    [].forEach.call(row.querySelectorAll('.msg-chip'), el => el.remove());
    counts = counts || {};
    var mine = myReacts[mid] || null;
    Object.keys(counts).forEach(function (emoji) {
      if (!emoji || emoji.length > 8 || /[<>"'`]/.test(emoji)) return;
      var chip = document.createElement('button');
      chip.type = 'button'; chip.className = 'msg-react msg-chip' + ((mine && mine.has && mine.has(emoji)) ? ' on' : '');
      chip.textContent = emoji + ' ' + counts[emoji];
      chip.dataset.mid = mid; chip.dataset.emoji = emoji;
      chip.title = 'React with ' + emoji;
      row.appendChild(chip);
    });
  }
  function openPicker(btn, mid) {
    var old = document.querySelector('.react-picker');
    if (old) old.remove();
    var p = document.createElement('div');
    p.className = 'react-picker';
    QUICK_REACTIONS.forEach(function (e) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = e;
      b.onclick = function (ev) { ev.stopPropagation(); p.remove(); toggleReact(mid, e); };
      p.appendChild(b);
    });
    var r = btn.getBoundingClientRect();
    p.style.position = 'fixed';
    p.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 260)) + 'px';
    p.style.top = Math.max(8, r.top - 44) + 'px';
    document.body.appendChild(p);
  }
  function toggleReact(mid, emoji) {
    var set = myReacts[mid] || (myReacts[mid] = new Set());
    var on = set.has(emoji);
    if (on) set.delete(emoji); else set.add(emoji);
    fetch(apiHost + '/api/messages/' + mid + '/react', {
      method: on ? 'DELETE' : 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ emoji: emoji })
    }).then(r => r.json()).then(function (d) {
      if (d && d.error) { addSys(d.error); return; }
      if (d && d.counts) paintReactions(mid, d.counts);
    }).catch(function () { addSys('Could not react.'); });
  }
  function togglePin(mid) {
    fetch(apiHost + '/api/messages/' + mid + '/pin', {
      method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ pin: true })
    }).then(r => r.json()).then(function (d) {
      if (d && d.error) { addSys(d.error); return; }
      loadPinned();
    }).catch(function () { addSys('Pin failed.'); });
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    if (!t.closest('.react-picker')) {
      var p = document.querySelector('.react-picker');
      if (p) p.remove();
    }
    var chip = t.closest('.msg-chip');
    if (chip) { ev.stopPropagation(); toggleReact(chip.dataset.mid, chip.dataset.emoji); return; }
    var pinBtn = t.closest('.msg-pin');
    if (pinBtn) { ev.stopPropagation(); togglePin(pinBtn.dataset.mid); return; }
    var plus = t.closest('.msg-react');
    if (plus && plus.dataset.mid && !plus.classList.contains('msg-chip') && !plus.classList.contains('msg-pin')) {
      ev.stopPropagation(); openPicker(plus, plus.dataset.mid); return;
    }
  });

  // ── Membership for the pin gate + rules gate ─────────────────
  (async function () {
    if (!TOKEN) return;
    try {
      var m = await fetch(apiHost + '/api/servers/' + SID + '/membership', { headers: authHeaders() }).then(r => r.json());
      if (m && m.member) myRole = m.role || 'member';
    } catch (e) {}
  })();

  // ── WebSocket: same protocol as /chat ────────────────────────
  function sendJoin(name) {
    var payload = JSON.stringify({ type: 'join', lobby: name, token: TOKEN });
    if (wsReady && ws) ws.send(payload); else pendingJoin = payload;
  }
  function connectWs() {
    var wsHost = (typeof WS_URL !== 'undefined' && WS_URL) ? WS_URL.replace(/^wss?:\/\//, '') : location.host;
    var proto = (typeof WS_URL !== 'undefined' && WS_URL && WS_URL.startsWith('wss')) ? 'wss' : location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + wsHost);
    ws.onopen = function () {
      wsReady = true; reconnectTries = 0;
      $('msgInput').disabled = false;
      if (pendingJoin) { ws.send(pendingJoin); pendingJoin = null; }
    };
    ws.onmessage = onWs;
    ws.onclose = function () {
      wsReady = false; $('msgInput').disabled = true;
      if (reconnectTries < 5) {
        setTimeout(connectWs, Math.min(30000, 1000 * Math.pow(2, reconnectTries++)));
      } else {
        addSys('Still offline. Refresh to reconnect.');
      }
    };
  }
  function onWs(e) {
    var msg;
    try { msg = JSON.parse(e.data); } catch (err) { return; }
    switch (msg.type) {
      case 'joined':
        var sys = mEl.querySelector('.system:last-child');
        if (sys && /Joining /.test(sys.textContent)) sys.remove();
        break;
      case 'message':
        if (current && msg.lobby === current.name) {
          var existing = msg.cid ? mEl.querySelector('[data-cid="' + msg.cid + '"]') : null;
          if (existing) existing.classList.remove('pending');
          else addMsg(msg.username, msg.text, msg.ts, msg.avatar_url, msg.user_id, msg.id);
          if (document.hidden) document.title = '(1) Cudic — Server';
        }
        break;
      case 'message_saved':
        if (msg.id && msg.cid) {
          var row = mEl.querySelector('[data-cid="' + msg.cid + '"]');
          if (row) { row.dataset.mid = msg.id; row.querySelector('.msg-react') || armActions(row, msg.id, ME); }
        }
        break;
      case 'user_list':
        $('onlineCount').textContent = (msg.users || []).length ? (msg.users || []).length + ' online' : '';
        break;
      case 'user_join':
        addSys(msg.username + ' joined', 'join');
        break;
      case 'typing':
        if (current && msg.lobby === current.name) {
          var ti = $('typingIndicator');
          ti.textContent = msg.username + ' is typing…';
          ti.style.display = 'block';
          clearTimeout(ti._t);
          ti._t = setTimeout(function () { ti.style.display = 'none'; }, 3000);
        }
        break;
      case 'react':
        if (current && msg.lobby === current.name) paintReactions(msg.id, msg.counts);
        break;
      case 'pin':
        if (current && msg.lobby === current.name) {
          loadPinned();
        }
        break;
      case 'error':
        if (msg.text === 'Sign in required.') { location.href = '/login'; return; }
        if (msg.code === 'rules_required' && msg.serverId) { showRules(msg.serverId); return; }
        if (msg.code === 'not_member') { autoJoin(); return; }
        addSys(msg.text);
        break;
    }
  }
  function addSys(text, cls) {
    var div = document.createElement('div');
    div.className = 'system' + (cls ? ' ' + cls : '');
    div.textContent = text;
    mEl.hidden = false;
    mEl.appendChild(div);
    mEl.scrollTop = mEl.scrollHeight;
  }
  async function autoJoin() {
    // Deep-linked non-members on a public server: join, then re-join channel.
    try {
      var r = await fetch(apiHost + '/api/servers/' + SID + '/join', {
        method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({})
      }).then(x => x.json());
      if (r.error) { setStatus('Members only', 'Join this server from the browse page first.'); return; }
      if (current) sendJoin(current.name);
    } catch (e) { setStatus('Could not join', 'Try again shortly.'); }
  }
  async function showRules(sidTxt) {
    try {
      var d = await fetch(apiHost + '/api/servers', { headers: authHeaders() }).then(r => r.json());
      var s2 = (d.servers || []).find(x => x.id === (sidTxt || SID));
      $('rulesText').textContent = (s2 && s2.rules) || 'Be kind — no harassment, hate speech, or slurs.';
      $('rulesOverlay').hidden = false;
    } catch (e) { addSys('Rules are required before you can chat here.'); }
  }
  $('rulesAccept').onclick = async function () {
    try {
      await fetch(apiHost + '/api/servers/' + SID + '/rules/accept', { method: 'POST', headers: authHeaders() });
    } catch (e) {}
    $('rulesOverlay').hidden = true;
    if (current) sendJoin(current.name);
  };
  $('rulesLater').onclick = function () {
    $('rulesOverlay').hidden = true;
    addSys('You need to accept the rules to send messages here.');
  };
  $('rulesOverlay').hidden = true;

  // ── Sending ─────────────────────────────────────────────────
  $('chatForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('msgInput');
    var text = input.value.trim();
    if (!text || !ws || ws.readyState !== 1 || !current) return;
    var cid = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    addMsg(MYNAME, text, new Date().toISOString(), MYAVA, ME, null);
    var last = mEl.lastElementChild;
    if (last) { last.classList.add('pending'); last.dataset.cid = cid; }
    ws.send(JSON.stringify({ type: 'message', text: text, cid: cid }));
    input.value = '';
  });
  var typingOn = false;
  $('msgInput').addEventListener('input', function () {
    if (!ws || ws.readyState !== 1) return;
    if (!typingOn) {
      typingOn = true;
      try { ws.send(JSON.stringify({ type: 'typing' })); } catch (e) {}
      setTimeout(function () { typingOn = false; }, 2500);
    }
  });
  $('menuBtn').onclick = function () { $('serverSidebar').classList.toggle('open'); };
  window.addEventListener('pagehide', function () { try { ws.close(); } catch (e) {} });

  boot();
})();
  </script>
</body>
</html>
