    <style>
        body {
            display: flex;
            overflow: hidden;
            height: 100%;
        }

        .servers-layout {
            flex: 1;
            width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
            background: var(--panel);
        }

        .servers-content {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px;
        }

        .section-title {
            font-family: var(--font-head);
            font-weight: 600;
            font-size: 1rem;
            margin: 24px 0 12px;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
        }

        .server-card {
            background: var(--panel-raised);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 16px;
            cursor: pointer;
            transition: border-color 0.15s;
            position: relative;
        }

        .server-card:hover {
            border-color: var(--signal);
        }

        .server-card-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .server-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: var(--signal-tint);
            color: var(--signal);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
            overflow: hidden;
        }

        .server-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .server-name {
            font-family: var(--font-head);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .server-desc {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-bottom: 10px;
            min-height: 20px;
        }

        .server-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            color: var(--text-tertiary);
        }

        .badge {
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.65rem;
        }

        .badge-public {
            background: color-mix(in srgb, var(--success) 12%, transparent);
            color: var(--success);
        }

        .badge-private {
            background: color-mix(in srgb, var(--ember) 16%, transparent);
            color: var(--ember-deep);
        }

        .invite-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .invite-code {
            flex: 1;
            background: var(--ink);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 6px 10px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .btn-copy {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text-primary);
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-copy:hover {
            border-color: var(--signal);
        }

        .card-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .card-actions button {
            flex: 1;
            padding: 7px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.78rem;
            cursor: pointer;
        }

        .card-actions button:hover {
            background: var(--panel-raised);
            color: var(--text-primary);
        }

        .card-actions .btn-join {
            background: var(--signal);
            color: var(--on-signal, #fff);
            border-color: var(--signal);
        }

        .card-actions .btn-join:hover {
            background: var(--signal-hover);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 24px;
            width: min(560px, 92vw);
            max-height: 88vh;
            overflow-y: auto;
        }

        .modal h2 {
            font-family: var(--font-head);
            font-weight: 600;
            margin-bottom: 16px;
        }

        .modal label {
            display: block;
            font-size: var(--text-xs);
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .modal input,
        .modal textarea,
        .modal select {
            width: 100%;
            background: var(--panel-raised);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            margin-bottom: 12px;
            outline: none;
        }

        .modal input:focus,
        .modal textarea:focus,
        .modal select:focus {
            border-color: var(--signal);
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .tpl-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .tpl-card {
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 10px;
            cursor: pointer;
            background: var(--panel-raised);
        }

        .tpl-card:hover { border-color: var(--signal); }

        .tpl-card.sel {
            border-color: var(--signal);
            background: var(--signal-tint);
        }

        .tpl-card b { display: block; font-size: 0.8rem; }
        .tpl-card span { font-size: 0.68rem; color: var(--text-secondary); display: block; margin-top: 2px; }
        .tpl-card em { font-style: normal; font-size: 0.65rem; color: var(--text-tertiary); }
        /* ── Directory layout ─────────────────────────────────────
           Centred reading width, a rail for the servers you own and a
           wider grid for discovery. Both headers share one row. */
        .servers-content {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            grid-template-areas:
                "intro intro"
                "ad ad"
                "ownhead pubhead"
                "owngrid pubgrid";
            align-content: start;
            column-gap: 36px;
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 26px 30px 56px;
            box-sizing: border-box;
        }

        .hero {
            grid-area: intro;
            padding: 22px 24px;
            margin-bottom: 16px;
        }

        .hero h1 {
            font-size: 1.55rem;
            letter-spacing: -0.02em;
            margin-bottom: 5px;
        }

        .hero p {
            margin: 0;
            font-size: 0.86rem;
            max-width: 58ch;
        }

        .ad-frame {
            grid-area: ad;
            justify-self: center;
            max-width: 100%;
            margin: 0 0 26px;
        }

        .section-title {
            grid-area: ownhead;
            min-height: 42px;
            margin: 0 0 10px;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        #ownCount {
            font-family: var(--font-mono);
            font-size: 0.66rem;
            font-weight: 400;
            letter-spacing: 0.06em;
            color: var(--text-tertiary);
        }

        .sec-head {
            grid-area: pubhead;
            min-height: 42px;
            margin: 0 0 10px;
            padding: 0;
        }

        .sec-head h2 {
            font-size: 0.95rem;
        }

        .srv-sort {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .srv-sort span {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        .srv-sort .sortsel {
            padding: 5px 8px;
            font-size: 0.75rem;
        }

        #ownGrid {
            grid-area: owngrid;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #publicGrid {
            grid-area: pubgrid;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px;
            align-content: start;
        }

        /* Cards: equal-height columns, description clamped so action rows line up. */
        .server-card {
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding: 14px;
            border-radius: 12px;
        }

        .server-card-head {
            margin-bottom: 9px;
        }

        .server-card-head > div:last-child {
            min-width: 0;
        }

        .server-icon {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            font-size: 0.8rem;
        }

        .server-name {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .server-desc {
            flex: 1 1 auto;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.6em;
            margin-bottom: 8px;
        }

        .server-meta {
            font-size: 0.68rem;
        }

        .invite-row {
            margin-top: 8px;
        }

        .invite-code {
            min-width: 0;
            padding: 5px 8px;
            font-size: 0.7rem;
        }

        .btn-copy {
            padding: 5px 10px;
            font-size: 0.72rem;
        }

        .card-actions {
            margin-top: 8px;
        }

        .card-actions button,
        .card-actions a {
            min-height: 30px;
            padding: 5px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
        }

        #ownGrid .server-card > a.btn {
            padding: 7px !important;
            margin-top: 8px !important;
        }

        /* Card pass: identity, copy, facts, actions. Later rules win over the
           first pass above, so the markup classes can stay small. */
        .server-card {
            padding: 16px;
            border-radius: 14px;
        }

        .server-card:hover {
            border-color: color-mix(in srgb, var(--signal) 55%, var(--line));
            background: color-mix(in srgb, var(--panel-raised) 92%, var(--panel));
        }

        .server-card-head {
            align-items: flex-start;
            gap: 11px;
            margin-bottom: 12px;
        }

        .server-id {
            flex: 1;
            min-width: 0;
        }

        .server-icon {
            position: relative;
            width: 42px;
            height: 42px;
            border-radius: 11px;
            border: 1px solid color-mix(in srgb, var(--signal) 22%, var(--line));
            font-size: 0.8rem;
            letter-spacing: 0.02em;
        }

        .server-icon img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .server-initials {
            font-family: var(--font-head);
            font-weight: 700;
        }

        .server-name {
            font-size: 0.92rem;
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .server-badges {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 2px 6px;
            font-size: 0.6rem;
            line-height: 1.4;
        }

        .badge-yours {
            background: var(--signal-tint);
            color: var(--signal);
        }

        .server-desc {
            min-height: 2.3em;
            margin-bottom: 0;
            color: var(--text-secondary);
            font-size: 0.78rem;
            line-height: 1.5;
        }

        .server-meta {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 12px;
            padding-top: 11px;
            border-top: 1px solid var(--line);
            font-size: 0.68rem;
            color: var(--text-tertiary);
        }

        .server-meta b {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .meta-sep {
            width: 1px;
            height: 10px;
            background: var(--line);
        }

        .meta-live {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .meta-live.is-live {
            color: var(--success);
        }

        .server-invite {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            margin-top: 10px;
            padding: 6px 8px 6px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
        }

        .invite-label {
            font-family: var(--font-mono);
            font-size: 0.56rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        .server-invite .invite-code {
            flex: 1;
            min-width: 0;
            padding: 0;
            border: 0;
            background: none;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }

        .invite-copy {
            flex-shrink: 0;
            padding: 4px 9px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.68rem;
            cursor: pointer;
        }

        .invite-copy:hover {
            border-color: var(--signal);
            color: var(--text-primary);
        }

        .server-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .srv-btn {
            flex: 1;
            min-width: 0;
            min-height: 32px;
            padding: 0 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.73rem;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
        }

        .srv-btn:hover {
            border-color: var(--signal);
            color: var(--text-primary);
        }

        .srv-btn-primary {
            background: var(--signal);
            border-color: var(--signal);
            color: var(--on-signal, #fff);
            font-weight: 600;
        }

        .srv-btn-primary:hover {
            background: var(--signal-hover);
            border-color: var(--signal-hover);
            color: var(--on-signal, #fff);
        }

        .srv-btn-danger:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .member-stack {
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
        }

        .member-ava {
            position: relative;
            width: 20px;
            height: 20px;
            margin-left: -6px;
            border: 1px solid var(--panel-raised);
            border-radius: 50%;
            background: var(--panel);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text-secondary);
            font-family: var(--font-head);
            font-size: 0.56rem;
            font-weight: 700;
        }

        .member-ava:first-child {
            margin-left: 0;
        }

        .member-ava img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* ── Colour pass ─────────────────────────────────────────
           Each server gets a deterministic accent, used by its icon, top
           rule, hover edge and member tint. Colour is an accent on the
           theme's surfaces, not a repaint. */
        .server-card.srv-accent-0 { --srv-accent: #FF9B3D; }
        .server-card.srv-accent-1 { --srv-accent: #48C9A9; }
        .server-card.srv-accent-2 { --srv-accent: #6CB6FF; }
        .server-card.srv-accent-3 { --srv-accent: #B69CFF; }
        .server-card.srv-accent-4 { --srv-accent: #FF8FB8; }

        :root:not([data-theme="dark"]) .server-card.srv-accent-0 { --srv-accent: #C26200; }
        :root:not([data-theme="dark"]) .server-card.srv-accent-1 { --srv-accent: #0B8562; }
        :root:not([data-theme="dark"]) .server-card.srv-accent-2 { --srv-accent: #2563C9; }
        :root:not([data-theme="dark"]) .server-card.srv-accent-3 { --srv-accent: #6D4AE0; }
        :root:not([data-theme="dark"]) .server-card.srv-accent-4 { --srv-accent: #C23672; }

        .servers-content {
            background: transparent;
        }

        .hero {
            position: relative;
            overflow: hidden;
            isolation: isolate;
            padding: 42px 38px 44px;
            border: 1px solid #303566;
            border-radius: 16px;
            background: #1D2044;
        }

        .hero-inner {
            position: relative;
            z-index: 2;
            transform-style: preserve-3d;
            transition: transform 0.3s ease-out;
            will-change: transform;
        }

        .hero h1 {
            display: block;
            max-width: 18ch;
            margin-bottom: 12px;
            font-size: clamp(2rem, 4.2vw, 3.15rem);
            line-height: 1.02;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            color: #fff;
            perspective: 800px;
        }

        .hero-letter {
            display: inline-block;
            transform-origin: 50% 100%;
            will-change: transform, opacity, filter;
        }

        .hero-letter.is-space { width: 0.3em; }

        .hero p {
            max-width: 58ch;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .hero-fx {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .hero-decor {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .hero-ring {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 50%;
        }

        .hero-ring-a {
            width: 290px;
            height: 290px;
            right: 3%;
            top: -150px;
            animation: hero-drift-a 18s ease-in-out infinite alternate;
        }

        .hero-ring-b {
            width: 150px;
            height: 150px;
            right: 20%;
            bottom: -84px;
            border-color: color-mix(in srgb, var(--signal) 55%, transparent);
            animation: hero-drift-b 13s ease-in-out infinite alternate;
        }

        .hero-chip {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            opacity: 0.8;
        }

        .hero-chip-a { right: 17%; top: 26%; background: var(--signal); animation: hero-float 7s ease-in-out infinite; }
        .hero-chip-b { right: 8%; top: 62%; background: #6CB6FF; animation: hero-float 9s ease-in-out infinite reverse; }
        .hero-chip-c { right: 29%; bottom: 20%; width: 6px; height: 6px; background: #48C9A9; animation: hero-float 6s ease-in-out infinite 0.8s; }

        .hero-rule {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 3;
            height: 3px;
            background: var(--signal);
            transform-origin: left center;
        }

        .server-card:hover .server-cover-mark { transform: scale(1.07) rotate(-2deg); }

        @keyframes hero-drift-a {
            from { transform: translate3d(0, 0, 0) rotate(0deg); }
            to { transform: translate3d(-20px, 16px, 0) rotate(22deg); }
        }

        @keyframes hero-drift-b {
            from { transform: translate3d(0, 0, 0); }
            to { transform: translate3d(14px, -18px, 0); }
        }

        @keyframes hero-float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-14px) rotate(90deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .hero-ring, .hero-chip { animation: none; }
            .hero-inner { transition: none; }
            .server-card, .server-cover-mark { transition: none; }
            .server-card:hover { transform: none; }
        }

        #ownCount {
            padding: 2px 7px;
            border-radius: 999px;
            background: var(--signal-tint);
            color: var(--signal);
        }

        .server-card {
            --srv-accent: var(--signal);
            overflow: hidden;
            border-color: color-mix(in srgb, var(--srv-accent) 30%, var(--line));
            background: var(--panel-raised);
        }

        /* Discovery cards: solid cover, icon overlapping it, copy below. */
        .server-card {
            padding: 0;
        }

        .server-cover {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 132px;
