name: Discord updates

# Every push to main goes out to #updates using the `Updates:` line written in
# the commit — a hand-written sentence, no model and no key. Only main, because
# the same commit is pushed to master as well and the channel should hear each
# change once.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two pushes close together should not race each other into the channel.
concurrency:
  group: discord-updates
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Say what changed
        env:
          DISCORD_WEBHOOK_UPDATES: ${{ secrets.DISCORD_WEBHOOK_UPDATES }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node tools/discord-update.mjs
