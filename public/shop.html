<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmetics — Cudic</title>
<meta name="description" content="Spend Cudic coins on profile frames, banners, effects, name styles, titles and emoji packs.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cudic">
<meta property="og:title" content="Cosmetics — Cudic">
<meta property="og:description" content="Spend Cudic coins on profile frames, banners, effects, name styles, titles and emoji packs.">

<style>
.shop-layout{display:flex;flex-direction:column}
.shop-scroll{flex:1;min-height:0;overflow-y:auto}
.shop-inner{max-width:1150px;margin:0 auto;width:100%;padding:26px 30px 90px}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;color:var(--text-secondary);letter-spacing:.02em}

/* balance pill in the topbar */
.balance{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--panel-raised);border-radius:999px;padding:8px 16px;font-family:"Geist Mono",ui-monospace,monospace;font-size:12px}
.balance b{font-weight:600;color:var(--signal)}
.coin{width:14px;height:14px;border-radius:50%;background:linear-gradient(140deg,#f7d272,#c99b25);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25);display:inline-block;flex-shrink:0}

/* tabs: flat mono toolbar row */
.tabs{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.tab{flex:0 0 auto;border:0;border-right:1px solid var(--line);background:transparent;color:var(--text-secondary);padding:12px 18px;font-family:"Geist Mono",ui-monospace,monospace;font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .12s steps(2),color .12s steps(2)}
.tab:last-child{border-right:0}
.tab:hover{background:var(--panel-raised);color:var(--text-primary)}
.tab[aria-selected="true"]{background:var(--signal);color:#0d0e10}

/* your look: slim hairline strip */
.look{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--panel-raised);display:flex;align-items:center;gap:13px;padding:10px 14px;margin-bottom:22px;min-height:104px}
.lookhead{position:absolute;inset:0;background:var(--panel);transition:none}
.look > *:not(.lookhead){position:relative;z-index:1}
.lookhead.cx-bn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,6,10,.55),rgba(4,6,10,.12) 55%,rgba(4,6,10,0))}
.lookname,.lookmeta{text-shadow:0 1px 3px rgba(0,0,0,.45)}
.lookava{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-weight:600;font-size:1.15rem;color:var(--signal);overflow:hidden;flex-shrink:0}
.lookava img{width:100%;height:100%;object-fit:cover}
.lookname{font-family:var(--font-head);font-weight:600;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lookmeta{font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.03em;color:var(--text-secondary);margin-top:3px}
.looksave{font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;color:var(--text-secondary);margin-left:auto;text-align:right;min-height:18px}
.looksave.ok{color:var(--signal)}
.looksave.err{color:var(--danger,#ff8c7a)}

/* hairline grid: square flat cells */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;display:flex;flex-direction:column;transition:background .12s steps(2)}
.item:hover{background:var(--panel-raised)}
.item.owned{box-shadow:inset 0 2px 0 var(--line)}
.item.worn{box-shadow:inset 0 2px 0 var(--signal)}
.pv{height:112px;display:grid;place-items:center;background:var(--panel);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.pv:after{content:"";position:absolute;inset:0;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/20px 20px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/20px 20px;opacity:40%;pointer-events:none}
.pv .sample{width:56px;height:56px;background:var(--panel-raised);border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:600;color:var(--text-secondary)}
.pv .bnswatch{width:86%;height:66px;border:1px solid var(--line)}
.pv .efbox{width:86%;height:66px;background:var(--panel-raised);border:1px solid var(--line);display:grid;place-items:center;font-family:"Geist Mono",ui-monospace,monospace;font-size:.66rem;color:var(--text-secondary);letter-spacing:.18em}
.pv .namesample{font-weight:600;font-size:1.4rem;color:var(--text-primary)}
.pv .emojis{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:0 10px;font-size:1.1rem;line-height:1}
.info{padding:13px 15px 2px;flex:1}
.kind{font-family:"Geist Mono",ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--text-secondary)}
.title{font-family:var(--font-head);font-weight:600;font-size:.98rem;margin-top:5px;color:var(--text-primary)}
.blurb{font-size:.78rem;color:var(--text-secondary);margin-top:4px;line-height:1.45}
.acts{display:flex;align-items:center;gap:8px;padding:11px 15px 14px}
.price{display:inline-flex;align-items:center;gap:6px;font-family:"Geist Mono",ui-monospace,monospace;font-weight:600;font-size:12px;margin-right:auto;color:var(--text-primary)}
.price.free{color:var(--signal)}

/* flat mono buttons */
.shop-scroll .btn{display:inline-flex;align-items:center;justify-content:center;font-family:"Geist Mono",ui-monospace,monospace;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:9px 14px;border-radius:8px;border:1px solid var(--ink,#f7f5ec);background:transparent;color:var(--text-primary);cursor:pointer;transition:background .12s steps(2),color .12s steps(2),border-color .12s steps(2)}
.shop-scroll .btn:hover{background:var(--text-primary);color:var(--panel)}
.shop-scroll .btn.primary{background:var(--signal);color:#0d0e10;border-color:var(--signal)}
.shop-scroll .btn.primary:hover{background:var(--text-primary);border-color:var(--text-primary);color:var(--panel)}
.shop-scroll .btn.off{border-color:var(--line);color:var(--text-secondary)}
.shop-scroll .btn.off:hover{background:var(--panel-raised);color:var(--text-primary)}
.shop-scroll .btn:disabled{opacity:45%;cursor:default;background:transparent;color:var(--text-secondary);border-color:var(--line)}

@keyframes hop{50%{transform:translateY(-7px)}}
.item:hover .sample{animation:hop .6s steps(2) infinite}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.empty{font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;color:var(--text-secondary);padding:22px 4px}
.note{padding:20px 2px 0;color:var(--text-secondary);font-size:.82rem;line-height:1.6}
.note a{color:var(--signal)}
@media (max-width:700px){
  .shop-inner{padding:18px 14px 80px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
  .pv{height:92px}
  .look{flex-wrap:wrap}
  .looksave{margin-left:0;text-align:left;flex-basis:100%}
}
</style>
</head>
<body data-page="shop">
<div class="shop-layout page-panel">
  <div class="topbar">
    <h1>Shop</h1>
    <span class="balance"><span class="coin" aria-hidden="true"></span><b id="balanceNum">—</b>&nbsp;coins</span>
  </div>
  <div class="shop-scroll">
    <div class="shop-inner">

      <section class="look" id="lookCard" style="display:none" aria-label="Your current look">
        <div class="lookhead" id="lookBanner"></div>
        <div class="lookava" id="lookAvatar">?</div>
        <div>
          <div class="lookname"><span id="lookName">you</span><span id="lookTitle"></span></div>
          <div class="lookmeta" id="lookMeta">Nothing equipped yet.</div>
        </div>
        <div class="looksave" id="lookMsg" role="status"></div>
      </section>

      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-k="" aria-selected="true">Everything</button>
        <button class="tab" role="tab" data-k="frame" aria-selected="false">Frames</button>
        <button class="tab" role="tab" data-k="banner" aria-selected="false">Banners</button>
        <button class="tab" role="tab" data-k="effect" aria-selected="false">Effects</button>
        <button class="tab" role="tab" data-k="name" aria-selected="false">Name</button>
        <button class="tab" role="tab" data-k="title" aria-selected="false">Titles</button>
        <button class="tab" role="tab" data-k="emoji" aria-selected="false">Emoji</button>
      </div>

      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" style="display:none">Sign in to buy and wear cosmetics.</div>

      <p class="note">Coins come from <a href="/quests">quests</a>, the daily check-in, chatting, and weekly game jams. Cosmetics are cosmetic only — nothing here changes how games play or what you can publish.</p>

    </div>
  </div>
</div>

<script src="/config.js"></script>
<script src="/auth.js"></script>
<script src="/sidebar.js?v=25"></script>
<script src="/cudic-cosmetics.js?v=1"></script>
<script>
(function(){
  var SLOT_OF = { frame:'fr', banner:'bn', effect:'ef', name:'ne', title:'ti', emoji:'em' };
  var KIND_LABEL = { frame:'Frame', banner:'Banner', effect:'Profile effect', name:'Name style', title:'Title', emoji:'Emoji pack' };
  var state = { catalog:[], owned:{}, worn:{}, balance:0, filter:'', busy:false };

  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
  function apiHost(){ return (typeof WS_URL!=='undefined'&&WS_URL)?WS_URL.replace(/^wss?:\/\//,'https://'):''; }
  function token(){ try { if(window.getAuthToken) return window.getAuthToken().then(function(a){return a||null;}); var raw=localStorage.getItem('sb-qgcydphkaujomxyzwcht-auth-token'); var s=raw?JSON.parse(raw):null; return Promise.resolve(s&&s.access_token||null); } catch(e){ return Promise.resolve(null); } }
  function api(method, path, body){
    return token().then(function(t){
      return fetch(apiHost()+path,{method:method,headers:Object.assign({'Authorization':'Bearer '+(t||'')}, body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined})
        .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ return {ok:r.ok, d:d}; }); });
    });
  }
  function msg(text, ok){
    var el=document.getElementById('lookMsg');
    el.textContent=text||'';
    el.className='looksave'+(text?(ok?' ok':' err'):'');
  }

  // Which code is worn in a given slot (titles live in the `t` array).
  function wornCode(slot){
    if (slot==='ti') {
      var t = state.worn.t || [];
      for (var i=0;i<t.length;i++) if (state.catalog.some(function(c){return c.code===t[i];})) return t[i];
      return null;
    }
    return state.worn[slot] || null;
  }

  function preview(c){
    if (c.slot==='fr') return '<div class="sample cx-fr cx-fr--'+c.code+'">Aa</div>';
    if (c.slot==='bn') return '<div class="bnswatch cx-bn cx-bn--'+c.code+'"></div>';
    if (c.slot==='ef') return '<div class="efbox cx-ef cx-ef--'+c.code+'">EFFECT</div>';
    if (c.slot==='ne') return '<div class="namesample cx-ne--'+c.code+'">Aa</div>';
    if (c.slot==='ti') return '<span class="cx-title cx-title--'+c.code+'">'+esc(c.label)+'</span>';
    var set = (window.CudicCosmetics && CudicCosmetics.packs[c.code]) || {};
    var glyphs = Object.keys(set).slice(0,10).map(function(k){ return set[k]; }).join('');
    return '<div class="emojis">'+glyphs+'</div>';
  }

  function card(c){
    var owned = !!state.owned[c.code];
    var worn = wornCode(c.slot) === c.code;
    var canAfford = state.balance >= c.price;
    var cls = 'item'+(owned?' owned':'')+(worn?' worn':'');
    var act;
    if (worn) act = '<button class="btn off" data-act="unequip" data-code="'+c.code+'" data-slot="'+c.slot+'">Take off</button>';
    else if (owned) act = '<button class="btn primary" data-act="equip" data-code="'+c.code+'" data-slot="'+c.slot+'">Wear</button>';
    else act = '<button class="btn primary" data-act="buy" data-code="'+c.code+'"'+(canAfford?'':' disabled title="Not enough coins yet"')+'>'+(canAfford?'Buy':'Need more')+'</button>';
    return '<article class="'+cls+'" data-kind="'+c.kind+'">'
      + '<div class="pv">'+preview(c)+'</div>'
      + '<div class="info"><div class="kind">'+esc(KIND_LABEL[c.kind]||c.kind)+'</div>'
      + '<div class="title">'+esc(c.label)+'</div><div class="blurb">'+esc(c.blurb||'')+'</div></div>'
      + '<div class="acts"><span class="price'+(owned?' free':'')+'">'+(owned?'<span style="color:var(--signal)">Owned</span>':'<span class="coin" aria-hidden="true"></span>'+c.price)+'</span>'+act+'</div>'
      + '</article>';
  }

  function render(){
    var grid=document.getElementById('grid');
    var list = state.catalog.filter(function(c){ return !state.filter || c.kind===state.filter; });
    grid.innerHTML = list.length ? list.map(card).join('') : '<div class="empty">Nothing in this shelf yet.</div>';
    document.getElementById('balanceNum').textContent = state.balance;
    paintLook();
  }

  function paintLook(){
    var card=document.getElementById('lookCard');
    var av=document.getElementById('lookAvatar'), nm=document.getElementById('lookName'),
        bn=document.getElementById('lookBanner'), ti=document.getElementById('lookTitle');
    if(!window.CudicCosmetics) return;
    var c = {};
    if (state.worn.fr) c.frame = { code: state.worn.fr };
    if (state.worn.bn) c.banner = { code: state.worn.bn };
    if (state.worn.ef) c.effect = { code: state.worn.ef };
    if (state.worn.ne) c.name = { code: state.worn.ne };
    var tc = wornCode('ti');
    if (tc) {
      var item = state.catalog.find(function(x){ return x.code===tc; });
      c.title = { code: tc, label: item ? item.label : 'Title' };
    }
    bn.className = 'lookhead';
    CudicCosmetics.paint({ avatar: av, name: nm, banner: bn, titleHost: ti }, c);
    var worn = ['fr','bn','ef','ne'].filter(function(s){ return !!state.worn[s]; }).length + (tc?1:0);
    document.getElementById('lookMeta').textContent = worn ? worn + ' cosmetic' + (worn===1?'':'s') + ' worn' : 'Nothing equipped yet.';
    card.style.display = '';
  }

  function load(){
    // No session, no wardrobe: /api/cosmetics answers 401 signed out, so the
    // request was a console error for a page that could only show an empty
    // grid. Show the empty state instead of asking.
    return token().then(function(t){
      if (!t) {
        document.getElementById('grid').style.display='none';
        document.getElementById('empty').style.display='block';
        return null;
      }
      return api('GET','/api/cosmetics');
    }).then(function(r){
      if (!r) return;
      if (!r.ok || !r.d.cosmetics && !r.d.catalog) {
        if (r.d && r.d.error) msg(r.d.error, false);
        document.getElementById('grid').style.display='none';
        document.getElementById('empty').style.display='block';
        return;
      }
      var d=r.d;
      state.catalog = (d.catalog||[]).map(function(c){
        var kind = c.slot==='fr'?'frame':c.slot==='bn'?'banner':c.slot==='ef'?'effect':c.slot==='ne'?'name':c.slot==='ti'?'title':'emoji';
        return { code:c.code, label:c.label, price:c.price, blurb:c.blurb, slot:c.slot, kind:kind };
      });
      state.owned = {}; (d.owned||[]).forEach(function(c){ state.owned[c]=true; });
      state.worn = d.worn || {};
      state.balance = d.balance || 0;
      // Chat reads this cache to unlock emoji packs without an extra call.
      try {
        var packs = state.catalog.filter(function(c){ return c.slot==='em' && state.owned[c.code]; }).map(function(c){ return c.code; });
        localStorage.setItem('cudic_emoji_packs', JSON.stringify(packs));
      } catch(e){}
      render();
    });
  }

  document.getElementById('grid').addEventListener('click', function(e){
    var b = e.target.closest('button[data-act]');
    if (!b || state.busy) return;
    var code=b.dataset.code, act=b.dataset.act;
    state.busy=true; b.disabled=true;
    msg('');

    if (act==='buy') {
      api('POST','/api/cosmetics/buy',{code:code}).then(function(r){
        state.busy=false;
        if (!r.ok) { msg(r.d.error || 'Buy failed.', false); render(); return; }
        state.owned[code]=true;
        if (typeof r.d.balance==='number') state.balance=r.d.balance;
        msg('Bought — wear it from the card or your profile.', true);
        return load();
      });
      return;
    }

    // The card already carries the server slot code (fr/bn/ef/ne/ti/em).
    var s = b.dataset.slot || '';
    api('POST','/api/cosmetics/equip',{slot:s, code: act==='unequip' ? null : code}).then(function(r){
      state.busy=false;
      if (!r.ok) { msg(r.d.error || 'Could not save.', false); render(); return; }
      state.worn = r.d.worn || state.worn;
      msg(act==='unequip' ? 'Taken off.' : 'Worn — it shows on your profile and creator page.', true);
      render();
      try { localStorage.setItem('cudic_cosmetics_dirty','1'); } catch(e){}
    });
  });

  document.getElementById('tabs').addEventListener('click', function(e){
    var t=e.target.closest('.tab'); if(!t) return;
    Array.prototype.forEach.call(this.children, function(b){ b.setAttribute('aria-selected', b===t?'true':'false'); });
    state.filter = t.dataset.k;
    render();
  });

  // Reflect the signed-in user at the top of the preview card. Signed out this
  // was an unconditional /api/profile request, i.e. a 401 in the console for a
  // card that has no name to show anyway — ask only when a session exists.
  token().then(function(tok){
    if (!tok) return null;
    return api('GET','/api/profile');
  }).then(function(r){
    var p = r && r.d && r.d.profile;
    if (!p) return;
    var av=document.getElementById('lookAvatar');
    if (p.avatar_url) av.innerHTML='<img src="'+esc(p.avatar_url)+'" alt="">';
    else av.textContent=(p.display_name||'?').substring(0,2).toUpperCase();
    document.getElementById('lookName').textContent = p.display_name || 'you';
  });

  try { if (window.CudicCosmetics) CudicCosmetics.injectCss(); } catch(e){}
  load();
})();
</script>
</body>
</html>
