<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Cudic</title>
<meta name="description" content="That page is not here. Browse the game gallery or open Studio instead.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/cudic_sfsvg.svg">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('glox_theme');document.documentElement.dataset.theme=(t==='light'?'light':'dark');}catch(e){}</script>
<style>
:root{--bg:#0d0e10;--panel:#14161b;--line:#262a33;--ink:#f7f5ec;--mute:#9a9a94;--lime:#b8f23a;--blue:#3f7cff;--mark:url(/cudic-assets/brand/logo/cudic-mark-cream.svg);--num:var(--lime)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f7f5ec;--panel:#efece0;--line:#d6d2c2;--ink:#0d0e10;--mute:#6b6a63;--blue:#1b3fb8;--mark:url(/cudic-assets/brand/logo/cudic-mark-ink.svg);--num:var(--ink)}}
:root[data-theme="light"]{--bg:#f7f5ec;--panel:#efece0;--line:#d6d2c2;--ink:#0d0e10;--mute:#6b6a63;--blue:#1b3fb8;--mark:url(/cudic-assets/brand/logo/cudic-mark-ink.svg);--num:var(--ink)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Geist",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--blue)}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.bar{display:flex;align-items:stretch;border-bottom:1px solid var(--line);overflow-x:auto}
.bar a{display:flex;align-items:center;gap:10px;padding:16px 20px;color:var(--ink);text-decoration:none;font-weight:500;font-size:15px;white-space:nowrap;border-right:1px solid var(--line)}
.bar a:hover{background:var(--panel)}
.bar .brand{font-weight:600}
.bar .brand img{display:block;width:18px;height:18px}
.bar .brand .mk-l{display:none}
:root[data-theme="light"] .bar .brand .mk-d{display:none}
:root[data-theme="light"] .bar .brand .mk-l{display:block}
.bar .sp{flex:1;border-right:0}
main{flex:1;display:grid;grid-template-columns:1.02fr .98fr;max-width:1180px;width:100%;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.msg{padding:72px 44px;display:flex;flex-direction:column;align-items:flex-start;gap:16px;justify-content:center;border-right:1px solid var(--line);min-width:0}
.code{margin:0;font-family:"Geist Mono",ui-monospace,monospace;font-weight:500;font-size:clamp(64px,11vw,132px);line-height:.9;letter-spacing:-.04em;color:var(--num)}
h1{margin:0;font-weight:500;font-size:clamp(28px,4vw,44px);line-height:1.08;letter-spacing:-.03em}
p{margin:0;color:var(--mute);max-width:44ch}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:12px;padding:14px 20px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;transition:background .12s steps(2),color .12s steps(2)}
.btn:after{content:"→";transition:transform .12s steps(2)}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn:hover:after{transform:translateX(4px)}
.btn.primary{background:var(--lime);border-color:var(--lime);color:#0d0e10}
.btn.primary:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
aside{position:relative;background:var(--panel);display:flex;align-items:center;justify-content:center;min-height:320px;overflow:hidden}
aside:before{content:"";position:absolute;inset:0;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/32px 32px;opacity:.5}
aside:after{content:"";position:relative;width:132px;height:132px;background:var(--mark) center/contain no-repeat;opacity:.9;animation:cudiFloat 4s steps(8) infinite}
@keyframes cudiFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
aside:hover:after{animation:cudiWave .6s steps(6)}
@keyframes cudiWave{0%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){aside:after{animation:none}}
footer{padding:18px 28px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;border-top:1px solid var(--line);max-width:1180px;width:100%;margin:0 auto;color:var(--mute);font-size:13px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{border-color:var(--ink)}
footer .sp{flex:1}
@media(max-width:820px){main{grid-template-columns:1fr}.msg{padding:48px 24px;border-right:0}aside{min-height:220px;order:-1;border-bottom:1px solid var(--line)}aside:after{width:88px;height:88px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="/"><img class="mk-d" src="/cudic-assets/brand/logo/cudic-mark-cream.svg" alt=""><img class="mk-l" src="/cudic-assets/brand/logo/cudic-mark-ink.svg" alt="">Cudic</a>
  <a href="/games">Games</a>
  <a href="/studio">Studio</a>
  <a href="/docs">Docs</a>
  <span class="sp"></span>
  <a href="/login">Sign in</a>
</header>
<main>
  <section class="msg">
    <p class="code">404</p>
    <h1>That page isn’t here.</h1>
    <p>The link may be old, or the game may have been unpublished. The gallery is still open.</p>
    <div class="actions">
      <a class="btn primary" id="playRandom" href="/games">Play a random game</a>
      <a class="btn" href="/games">Browse games</a>
      <a class="btn" href="/">Home</a>
    </div>
  </section>
  <aside aria-hidden="true"></aside>
</main>
<footer>
  <span>Made with Cudic Studio.</span>
  <span class="sp"></span>
  <a href="/privacy">Privacy</a>
  <a href="/terms">Terms</a>
</footer>
<script>
(function(){
  var btn = document.getElementById('playRandom');
  if (!btn) return;
  var api = (typeof WS_URL !== 'undefined' && WS_URL)
    ? WS_URL.replace(/^wss?:\/\//, 'https://')
    : ((location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? '' : 'https://glox-o7rr.onrender.com');
  fetch(api + '/api/games')
    .then(function(r){ return r.json(); })
    .then(function(d){
      var list = (d.games || []).filter(function(g){ return g && g.id; });
      if (!list.length) return;
      var g = list[Math.floor(Math.random() * list.length)];
      btn.href = '/view.html?id=' + encodeURIComponent(g.id);
    })
    .catch(function(){});
})();
</script>
<script src="/auth-nav.js?v=1"></script>
</body>
</html>
